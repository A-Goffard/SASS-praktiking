<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Sass</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bienvenidos a Sass</h1>
    </header>
    
    <main>
        <section class="bloque bloque-1">
            <h2>Título 1</h2>
            <p>Este es el primer bloque con su propio color.</p>
            <img src="images/1.png" alt="Imagen 1">
            <div class="btn-container">
                <button class="btn btn-1">Más información</button>
            </div>
        </section>

        <section class="bloque bloque-2">
            <h2>Título 2</h2>
            <p>Este es el segundo bloque con un color distinto.</p>
            <img src="images/2.png" alt="Imagen 2">
            <div class="btn-container">
                <button class="btn btn-2">Más información</button>
            </div>
        </section>

        <section class="bloque bloque-3">
            <h2>Título 3</h2>
            <p>Este es el tercer bloque con otro color más.</p>
            <img src="images/3.png" alt="Imagen 3">
            <div class="btn-container">
                <button class="btn btn-3">Más información</button>
            </div>
        </section>
    </main>
</body>
</html>
